name: build

# Every push / PR: prove the tray app still compiles.
# Pushing a tag like v1.0.0: also package the app and publish it as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # needed to create the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check gateway syntax
        run: node --check whisper-gateway.js

      - name: Build WhisprGateway.exe (C# compiler that ships with Windows)
        shell: powershell
        run: ./build.ps1

      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          $name = "WhisprGateway-$env:GITHUB_REF_NAME"
          New-Item -ItemType Directory -Force "dist\$name\models", "dist\$name\docs" | Out-Null
          Copy-Item WhisprGateway.exe, whisper-gateway.js, gateway.config.default.json, README.md, README.zh-TW.md, LICENSE "dist\$name\"
          Copy-Item models\README*.md "dist\$name\models\"
          Copy-Item docs\*.md "dist\$name\docs\"
          Compress-Archive -Path "dist\$name" -DestinationPath "dist\$name.zip"
          $hash = (Get-FileHash "dist\$name.zip" -Algorithm SHA256).Hash.ToLower()
          "Built by GitHub Actions from this tag's source.`n`nsha256 ($name.zip): ``$hash``" | Set-Content dist\notes.md -Encoding utf8

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" (Get-Item dist\*.zip).FullName --title "$env:GITHUB_REF_NAME" --notes-file dist\notes.md
